name: Validate Docker Compose

on:
  push:
    paths:
      - '**/docker-compose.yml'
  pull_request:
     paths:
       - '**docker-compose.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [calibre, immich, navidrome]
    steps:
      - uses: actions/checkout@v4
      - name: Validate ${{ matrix.service }}
        run: |
          cd ${{ matrix.service }}
          if [ -f .env.example ]; then
            cp .env.example .env
          fi
          docker compose config
  deploy:
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: self-hosted
    strategy:
      matrix:
        service: [calibre, immich, navidrome]
    steps:
      - uses: actions/checkout@v4
      - name: Deploy ${{ matrix.service }}
        run: |
          cp ${{ matrix.service }}/docker-compose.yml ~/${{ matrix.service }}/docker-compose.yml
          cd ~/${{ matrix.service }}
          docker compose up -d
